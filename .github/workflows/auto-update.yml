name: Auditoria e Autoatualização Periódica

on:
  schedule:
    # Executa todo domingo à meia-noite para garantir sanidade e métricas
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Validar Estrutura de Documentação
        run: |
          python -c "
          import os
          docs = [os.path.join(r, f) for r, d, files in os.walk('docs') for f in files if f.endswith('.md')]
          print(f'Total de capítulos validados: {len(docs)}')
          assert len(docs) >= 30, 'Erro: quantidade insuficiente de capítulos.'
          "
